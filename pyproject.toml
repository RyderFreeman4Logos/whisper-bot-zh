[project]
name = "whisper-bot-zh"
version = "0.2.0"
description = "Telegram bot for Chinese speech-to-text via any OpenAI-compatible Whisper endpoint (Groq by default)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings",
    "structlog",
    "ffmpeg-python",
    "aiogram>=3.22.0",
    "openai>=1.0",
    "litellm>=1.80.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_bot"]

[project.scripts]
whisper-bot-zh = "whisper_bot.main:main_cli"

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-requests",
    "types-ujson",
]

[tool.ruff]
line-length = 120
target-version = "py310"
select = ["E", "F", "B", "I", "UP", "PL", "RUF"]
ignore = ["E501"] # Ignore line length violations

[tool.ruff.isort]
known-first-party = ["whisper_bot"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "funasr.*",
    "telegram.*",
    "torch.*",
    "torchaudio.*",
    "ffmpeg.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow",
]
