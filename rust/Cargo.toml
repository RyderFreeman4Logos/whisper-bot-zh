[workspace]
resolver = "2"
members = ["whisper-bot-zh-rs"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/RyderFreeman4Logos/whisper-bot-zh"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
