[package]
name = "whisper-bot-zh-rs"
version = "0.3.0"
description = "Telegram bot: Groq ASR + parallel cloud/local LLM refinement (Rust port)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "whisper-bot-zh"
path = "src/main.rs"

[lib]
name = "whisper_bot_zh"
path = "src/lib.rs"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["macros", "ctrlc_handler", "rustls", "throttle"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
telegram_reqwest = { package = "reqwest", version = "0.11", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

futures = "0.3"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
